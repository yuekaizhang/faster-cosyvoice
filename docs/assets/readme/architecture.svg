<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title description">
  <title id="title">Faster CosyVoice inference architecture</title>
  <desc id="description">CosyVoice3 inputs, reference conditioning, speech-token generation, and token-to-waveform pipeline with DSpark, FlashInfer, packed batching, CUDA Graph, and CUDA MPS.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#202020"/>
    </marker>
    <style>
      .box { stroke: #202020; stroke-width: 1.4; }
      .data { fill: #dceef7; }
      .compute { fill: #ddf2dc; }
      .runtime { fill: #fde9b4; }
      .boundary { fill: none; stroke: #777; stroke-width: 1.1; stroke-dasharray: 5 4; }
      .arrow { fill: none; stroke: #202020; stroke-width: 1.35; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #666; stroke-width: 1.1; stroke-dasharray: 4 4; marker-end: url(#arrow); }
      text { fill: #171717; font-family: "Times New Roman", "Noto Serif", serif; text-anchor: middle; }
      .label { font-size: 16px; font-weight: 400; }
      .small { font-size: 12.5px; font-weight: 400; }
      .tiny { font-size: 12px; font-weight: 400; }
      .edge-label { font-size: 11.5px; fill: #444; }
      .boundary-label { font-size: 13px; fill: #555; font-style: italic; }
      .legend { font-size: 12px; text-anchor: start; }
    </style>
  </defs>

  <rect width="1000" height="760" fill="#fff"/>

  <!-- Runtime boundaries -->
  <rect class="boundary" x="278" y="487" width="674" height="112" rx="8"/>
  <text class="boundary-label" x="615" y="503">vLLM EngineCore process</text>
  <rect class="boundary" x="278" y="79" width="444" height="219" rx="8"/>
  <text class="boundary-label" x="500" y="95">Token2Wav worker process</text>

  <!-- Main generation path -->
  <rect class="box data" x="390" y="20" width="220" height="48" rx="7"/>
  <text class="label" x="500" y="49">Output Waveform</text>

  <rect class="box compute" x="390" y="112" width="220" height="54" rx="7"/>
  <text class="label" x="500" y="137">HiFT Vocoder</text>
  <text class="small" x="500" y="155">bucketed CUDA Graph</text>

  <rect class="box compute" x="310" y="200" width="380" height="84" rx="7"/>
  <text class="label" x="500" y="224">Flow-Matching</text>
  <text class="label" x="500" y="244">Diffusion Transformer (DiT)</text>
  <text class="small" x="500" y="268">FlashInfer ragged attention · packed layout · CUDA Graph</text>

  <rect class="box runtime" x="330" y="314" width="340" height="64" rx="7"/>
  <text class="label" x="500" y="341">Deadline-Aware Scheduler</text>
  <text class="small" x="500" y="362">playback deadlines · dynamic batching</text>

  <rect class="box data" x="390" y="420" width="220" height="58" rx="7"/>
  <text class="label" x="500" y="445">Speech-Token Stream</text>
  <text class="small" x="500" y="465">intermediate representation · 25 Hz</text>

  <rect class="box compute" x="330" y="515" width="340" height="70" rx="7"/>
  <text class="label" x="500" y="544">Autoregressive Speech-Token LLM</text>
  <text class="small" x="500" y="566">vLLM target model</text>

  <path class="arrow" d="M500 515 V479"/>
  <path class="arrow" d="M500 420 V379"/>
  <path class="arrow" d="M500 314 V285"/>
  <path class="arrow" d="M500 200 V167"/>
  <path class="arrow" d="M500 112 V69"/>

  <!-- Text prompt path -->
  <rect class="box compute" x="330" y="610" width="340" height="60" rx="7"/>
  <text class="label" x="500" y="635">Prompt Builder + Text Tokenizer</text>
  <text class="small" x="500" y="656">reference text · target text · prompt speech tokens</text>
  <path class="arrow" d="M500 610 V586"/>

  <rect class="box data" x="298" y="700" width="170" height="46" rx="7"/>
  <text class="label" x="383" y="729">Target Text</text>
  <rect class="box data" x="500" y="700" width="170" height="46" rx="7"/>
  <text class="label" x="585" y="729">Reference Text</text>
  <path class="arrow" d="M383 700 V680 H430 V671"/>
  <path class="arrow" d="M585 700 V680 H570 V671"/>

  <!-- Reference-audio path and its two consumers -->
  <rect class="box data" x="24" y="700" width="170" height="46" rx="7"/>
  <text class="label" x="109" y="729">Reference Audio</text>

  <rect class="box compute" x="24" y="590" width="220" height="75" rx="7"/>
  <text class="label" x="134" y="616">Reference Audio Encoders</text>
  <text class="small" x="134" y="637">S3Tokenizer · Mel extractor</text>
  <text class="small" x="134" y="654">CampPlus speaker encoder</text>
  <path class="arrow" d="M109 700 V666"/>

  <rect class="box data" x="24" y="396" width="220" height="92" rx="7"/>
  <text class="label" x="134" y="421">Flow Conditioning</text>
  <text class="small" x="134" y="443">prompt speech tokens</text>
  <text class="small" x="134" y="462">prompt Mel features</text>
  <text class="small" x="134" y="481">speaker embedding</text>
  <path class="arrow" d="M134 590 V489"/>
  <path class="arrow" d="M244 442 H270 V242 H309"/>

  <path class="arrow" d="M244 628 H329"/>
  <rect x="254" y="606" width="66" height="17" fill="#fff"/>
  <text class="edge-label" x="287" y="618">prompt tokens</text>

  <!-- Draft model and process-level sharing -->
  <rect class="box runtime" x="770" y="523" width="172" height="54" rx="7"/>
  <text class="label" x="856" y="546">DSpark Draft</text>
  <text class="small" x="856" y="564">propose K tokens</text>
  <path class="arrow" d="M770 550 H671"/>

  <rect class="box runtime" x="782" y="300" width="160" height="72" rx="7"/>
  <text class="label" x="862" y="326">CUDA MPS</text>
  <text class="small" x="862" y="347">optional process</text>
  <text class="small" x="862" y="364">overlap</text>
  <path class="feedback" d="M782 324 H746 V525 H671"/>
  <path class="feedback" d="M782 347 H746 V239 H691"/>

  <!-- Legend: color describes role, not pipeline direction -->
  <rect class="box data" x="754" y="28" width="14" height="14" rx="2"/>
  <text class="legend" x="776" y="40">Input, output, or intermediate data</text>
  <rect class="box compute" x="754" y="53" width="14" height="14" rx="2"/>
  <text class="legend" x="776" y="65">Model or preprocessing compute</text>
  <rect class="box runtime" x="754" y="78" width="14" height="14" rx="2"/>
  <text class="legend" x="776" y="90">Runtime optimization</text>
</svg>
