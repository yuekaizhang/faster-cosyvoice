<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="690" viewBox="0 0 1000 690" role="img" aria-labelledby="title description">
  <title id="title">Faster CosyVoice inference architecture</title>
  <desc id="description">CosyVoice3 speech-token generation and token-to-waveform pipeline with DSpark, FlashInfer, packed batching, CUDA Graph and CUDA MPS.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#202020"/>
    </marker>
    <style>
      .box { stroke: #202020; stroke-width: 1.4; }
      .io { fill: #dceef7; }
      .model { fill: #ddf2dc; }
      .runtime { fill: #fde9b4; }
      .output { fill: #f4d7d9; }
      .boundary { fill: none; stroke: #777; stroke-width: 1.1; stroke-dasharray: 5 4; }
      .arrow { fill: none; stroke: #202020; stroke-width: 1.35; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #202020; stroke-width: 1.25; }
      .feedback { fill: none; stroke: #666; stroke-width: 1.1; stroke-dasharray: 4 4; marker-end: url(#arrow); }
      text { fill: #171717; font-family: "Times New Roman", "Noto Serif", serif; text-anchor: middle; }
      .label { font-size: 16px; font-weight: 400; }
      .small { font-size: 12.5px; font-weight: 400; }
      .tiny { font-size: 12px; font-weight: 400; }
      .boundary-label { font-size: 13px; fill: #555; font-style: italic; }
      .legend { font-size: 12px; text-anchor: start; }
    </style>
  </defs>

  <rect width="1000" height="690" fill="#fff"/>

  <!-- Runtime boundaries -->
  <rect class="boundary" x="278" y="487" width="674" height="112" rx="8"/>
  <text class="boundary-label" x="615" y="503">vLLM EngineCore process</text>
  <rect class="boundary" x="278" y="79" width="444" height="219" rx="8"/>
  <text class="boundary-label" x="500" y="95">Token2Wav worker process</text>

  <!-- Main generation path -->
  <rect class="box output" x="390" y="20" width="220" height="48" rx="7"/>
  <text class="label" x="500" y="49">Output Waveform</text>

  <rect class="box model" x="390" y="112" width="220" height="54" rx="7"/>
  <text class="label" x="500" y="137">HiFT Vocoder</text>
  <text class="small" x="500" y="155">bucketed CUDA Graph</text>

  <rect class="box model" x="310" y="200" width="380" height="84" rx="7"/>
  <text class="label" x="500" y="224">Flow-Matching</text>
  <text class="label" x="500" y="244">Diffusion Transformer (DiT)</text>
  <text class="small" x="500" y="268">FlashInfer ragged attention · packed layout · CUDA Graph</text>

  <rect class="box runtime" x="330" y="314" width="340" height="64" rx="7"/>
  <text class="label" x="500" y="341">Deadline-Aware Scheduler</text>
  <text class="small" x="500" y="362">playback deadlines · dynamic batching</text>

  <rect class="box model" x="390" y="420" width="220" height="48" rx="7"/>
  <text class="label" x="500" y="449">Speech-Token Stream</text>

  <rect class="box runtime" x="300" y="515" width="400" height="70" rx="7"/>
  <text class="label" x="500" y="544">Autoregressive Speech-Token LLM</text>
  <text class="small" x="500" y="566">vLLM target · DSpark speculative decoding</text>

  <path class="arrow" d="M500 515 V469"/>
  <path class="arrow" d="M500 420 V379"/>
  <path class="arrow" d="M500 314 V285"/>
  <path class="arrow" d="M500 200 V167"/>
  <path class="arrow" d="M500 112 V69"/>

  <!-- Text input -->
  <rect class="box io" x="312" y="625" width="142" height="46" rx="7"/>
  <text class="label" x="383" y="654">Input Text</text>
  <rect class="box io" x="500" y="625" width="142" height="46" rx="7"/>
  <text class="label" x="571" y="654">Tokenizer</text>
  <path class="arrow" d="M455 648 H499"/>
  <path class="arrow" d="M571 625 V600 H550 V586"/>

  <!-- Reference path -->
  <rect class="box io" x="24" y="625" width="170" height="46" rx="7"/>
  <text class="label" x="109" y="654">Reference Audio</text>

  <rect class="box model" x="24" y="510" width="220" height="75" rx="7"/>
  <text class="label" x="134" y="536">Reference Frontend</text>
  <text class="small" x="134" y="556">S3Tokenizer · CampPlus</text>
  <text class="small" x="134" y="573">speaker encoder TensorRT</text>

  <rect class="box model" x="24" y="400" width="220" height="75" rx="7"/>
  <text class="label" x="134" y="426">Prompt Conditions</text>
  <text class="small" x="134" y="448">speech tokens</text>
  <text class="small" x="134" y="465">Mel features · speaker embedding</text>

  <path class="arrow" d="M109 625 V586"/>
  <path class="arrow" d="M134 510 V476"/>
  <path class="arrow" d="M244 438 H266 V550 H299"/>
  <path class="branch" d="M244 418 H272 V242 H309"/>
  <path d="M309 242 L301 238 L301 246 Z" fill="#202020"/>

  <!-- Draft model and process-level sharing -->
  <rect class="box runtime" x="770" y="523" width="172" height="54" rx="7"/>
  <text class="label" x="856" y="546">DSpark Draft</text>
  <text class="small" x="856" y="564">propose K tokens</text>
  <path class="arrow" d="M770 550 H701"/>

  <rect class="box runtime" x="782" y="300" width="160" height="72" rx="7"/>
  <text class="label" x="862" y="326">CUDA MPS</text>
  <text class="small" x="862" y="347">optional process</text>
  <text class="small" x="862" y="364">overlap</text>
  <path class="feedback" d="M782 324 H746 V540 H723"/>
  <path class="feedback" d="M782 347 H746 V239 H723"/>

  <!-- Legend -->
  <rect class="box io" x="774" y="28" width="14" height="14" rx="2"/>
  <text class="legend" x="796" y="40">Input / intermediate data</text>
  <rect class="box model" x="774" y="53" width="14" height="14" rx="2"/>
  <text class="legend" x="796" y="65">Model or GPU compute</text>
  <rect class="box runtime" x="774" y="78" width="14" height="14" rx="2"/>
  <text class="legend" x="796" y="90">Runtime optimization</text>
  <rect class="box output" x="774" y="103" width="14" height="14" rx="2"/>
  <text class="legend" x="796" y="115">Audio output</text>
</svg>
